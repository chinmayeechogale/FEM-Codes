# =============================================================
# INPUT FILE: Project 05 - 2D Incompressible Viscous Flow FEA
# =============================================================

# -------------------------------------------------------------
# PROBLEM DESCRIPTION
# -------------------------------------------------------------
TITLE:        "2D Incompressible Flow FEA - Lid-Driven Cavity"
DIMENSION:    2             # 2D problem
ANALYSIS:     STEADY        # STEADY or TRANSIENT
FLOW_MODEL:   NAVIER_STOKES # STOKES or NAVIER_STOKES
ELEMENT_TYPE: Q9_Q4         # Q9/Q4 Taylor-Hood; T6/T3; Q4_STAB (SUPG/PSPG)

# -------------------------------------------------------------
# MESH PARAMETERS
# -------------------------------------------------------------
MESH:
  # Lid-driven cavity: 1m x 1m square domain
  # 4x4 Q9 elements -> 9x9 velocity nodes = 81 nodes
  # Q4 pressure nodes at corners = 25 pressure nodes

  # Node coordinates: [x, y] in meters
  # (Listing corner + edge + center nodes for Q9 elements)
  NODES:
    # Row y=0.0
    1:  [0.0,  0.0]
    2:  [0.25, 0.0]
    3:  [0.5,  0.0]
    4:  [0.75, 0.0]
    5:  [1.0,  0.0]
    # Row y=0.125
    6:  [0.0,  0.125]
    7:  [0.25, 0.125]
    8:  [0.5,  0.125]
    9:  [0.75, 0.125]
    10: [1.0,  0.125]
    # Row y=0.25
    11: [0.0,  0.25]
    12: [0.25, 0.25]
    13: [0.5,  0.25]
    14: [0.75, 0.25]
    15: [1.0,  0.25]
    # Row y=0.375
    16: [0.0,  0.375]
    17: [0.25, 0.375]
    18: [0.5,  0.375]
    19: [0.75, 0.375]
    20: [1.0,  0.375]
    # Row y=0.5
    21: [0.0,  0.5]
    22: [0.25, 0.5]
    23: [0.5,  0.5]
    24: [0.75, 0.5]
    25: [1.0,  0.5]
    # Row y=0.625
    26: [0.0,  0.625]
    27: [0.25, 0.625]
    28: [0.5,  0.625]
    29: [0.75, 0.625]
    30: [1.0,  0.625]
    # Row y=0.75
    31: [0.0,  0.75]
    32: [0.25, 0.75]
    33: [0.5,  0.75]
    34: [0.75, 0.75]
    35: [1.0,  0.75]
    # Row y=0.875
    36: [0.0,  0.875]
    37: [0.25, 0.875]
    38: [0.5,  0.875]
    39: [0.75, 0.875]
    40: [1.0,  0.875]
    # Row y=1.0
    41: [0.0,  1.0]
    42: [0.25, 1.0]
    43: [0.5,  1.0]
    44: [0.75, 1.0]
    45: [1.0,  1.0]

  # Q9 element connectivity: [4 corners, 4 edge-midpoints, 1 center]
  # Each Q9 element: [n_SW, n_SE, n_NE, n_NW, n_S, n_E, n_N, n_W, n_C]
  ELEMENTS:
    1: [1,  3,  13, 11,  2,  8,  12,  6,  7]
    2: [3,  5,  15, 13,  4,  10, 14,  8,  9]
    3: [11, 13, 23, 21, 12,  18, 22, 16, 17]
    4: [13, 15, 25, 23, 14,  20, 24, 18, 19]
    5: [21, 23, 33, 31, 22,  28, 32, 26, 27]
    6: [23, 25, 35, 33, 24,  30, 34, 28, 29]
    7: [31, 33, 43, 41, 32,  38, 42, 36, 37]
    8: [33, 35, 45, 43, 34,  40, 44, 38, 39]

  # Q4 pressure nodes (corner nodes of Q9 elements)
  PRESSURE_NODES: [1, 3, 5, 11, 13, 15, 21, 23, 25, 31, 33, 35, 41, 43, 45]

# -------------------------------------------------------------
# FLUID PROPERTIES
# -------------------------------------------------------------
FLUID:
  RHO:   1.0       # Density [kg/m^3]
  MU:    0.01      # Dynamic viscosity [Pa*s]
  # Re = rho * U_lid * L / mu = 1.0 * 1.0 * 1.0 / 0.01 = 100
  # Change MU to adjust Re: MU=0.0025 -> Re=400, MU=0.001 -> Re=1000

# -------------------------------------------------------------
# BOUNDARY CONDITIONS
# -------------------------------------------------------------
BOUNDARY_CONDITIONS:

  # DIRICHLET: Prescribed velocity [u, v]
  # Format: node: [fix_u, fix_v, val_u, val_v]
  # fix = 1 (prescribed), 0 (free)

  # --- No-slip walls (bottom, left, right) ---
  # Bottom wall (y=0): u=0, v=0
  DIRICHLET:
    1:  [1, 1, 0.0, 0.0]
    2:  [1, 1, 0.0, 0.0]
    3:  [1, 1, 0.0, 0.0]
    4:  [1, 1, 0.0, 0.0]
    5:  [1, 1, 0.0, 0.0]
    # Left wall (x=0): u=0, v=0
    6:  [1, 1, 0.0, 0.0]
    11: [1, 1, 0.0, 0.0]
    16: [1, 1, 0.0, 0.0]
    21: [1, 1, 0.0, 0.0]
    26: [1, 1, 0.0, 0.0]
    31: [1, 1, 0.0, 0.0]
    36: [1, 1, 0.0, 0.0]
    # Right wall (x=1): u=0, v=0
    10: [1, 1, 0.0, 0.0]
    15: [1, 1, 0.0, 0.0]
    20: [1, 1, 0.0, 0.0]
    25: [1, 1, 0.0, 0.0]
    30: [1, 1, 0.0, 0.0]
    35: [1, 1, 0.0, 0.0]
    40: [1, 1, 0.0, 0.0]
    # --- Lid (top wall, y=1): u=1.0 m/s, v=0 ---
    41: [1, 1, 1.0, 0.0]
    42: [1, 1, 1.0, 0.0]
    43: [1, 1, 1.0, 0.0]
    44: [1, 1, 1.0, 0.0]
    45: [1, 1, 1.0, 0.0]

  # PRESSURE PIN: Fix pressure at one node to remove singularity
  PRESSURE_PIN:
    NODE: 1
    VALUE: 0.0

  # NEUMANN: Applied traction on boundary [tx, ty] in [Pa]
  # (No Neumann BCs for closed cavity)
  NEUMANN: {}

  # BODY FORCES: [bx, by] in [N/m^3]
  BODY_FORCE:
    BX: 0.0
    BY: 0.0    # Set to -RHO*g = -9.81 for gravity-driven flow

# -------------------------------------------------------------
# SOLVER PARAMETERS
# -------------------------------------------------------------
SOLVER:
  MODE:       1       # 0 = Stokes (linear); 1 = Picard; 2 = Newton-Raphson
  MAX_ITER:   100     # Maximum nonlinear iterations
  TOL:        1.0e-6  # Convergence tolerance (relative residual norm)
  GAMMA:      1.0     # Relaxation / underrelaxation factor
  LINEAR_SOLVER: DIRECT  # DIRECT or ITERATIVE (GMRES)
  PRECOND:    ILU        # Preconditioner for iterative solver: ILU, AMG

# -------------------------------------------------------------
# STABILIZATION (for equal-order elements Q4/Q4)
# -------------------------------------------------------------
STABILIZATION:
  TYPE:   SUPG_PSPG   # NONE, SUPG, PSPG, SUPG_PSPG, GLS
  TAU_TYPE: SHAKIB    # SHAKIB or CODINA (formula for stabilization parameter)

# -------------------------------------------------------------
# TRANSIENT PARAMETERS (used if ANALYSIS: TRANSIENT)
# -------------------------------------------------------------
TRANSIENT:
  T_START:    0.0      # Start time [s]
  T_END:      10.0     # End time [s]
  DT:         0.05     # Time step size [s]
  SCHEME:     BDF2     # BACKWARD_EULER, CRANK_NICOLSON, or BDF2
  U_INIT:     0.0      # Initial velocity (uniform) [m/s]
  V_INIT:     0.0      # Initial velocity (uniform) [m/s]
  P_INIT:     0.0      # Initial pressure (uniform) [Pa]
  SAVE_FREQ:  10       # Save output every N time steps
  MONITOR_NODES: [23]  # Center of cavity

# -------------------------------------------------------------
# NUMERICAL INTEGRATION
# -------------------------------------------------------------
INTEGRATION:
  ORDER: 3    # Gauss quadrature order (3x3 = 9 points for Q9)

# -------------------------------------------------------------
# OUTPUT OPTIONS
# -------------------------------------------------------------
OUTPUT:
  VELOCITY:       true    # u(x,y), v(x,y)
  PRESSURE:       true    # p(x,y)
  VORTICITY:      true    # omega = dv/dx - du/dy
  STREAMFUNCTION: true    # psi(x,y)
  DRAG_LIFT:      false   # Drag/lift on immersed surfaces
  CONVERGENCE:    true
  TIME_HISTORY:   true    # Transient only
  FORMAT:         vtk     # csv or vtk
